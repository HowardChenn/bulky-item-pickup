name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: ap-southeast-2

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Use Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Start DynamoDB Local
        run: docker compose -f compose.yaml up -d

      - name: Wait for DynamoDB Local
        run: |
          for attempt in {1..30}; do
            if aws dynamodb list-tables --endpoint-url http://127.0.0.1:8000 --no-cli-pager; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Create test tables
        run: |
          aws dynamodb create-table \
            --endpoint-url http://127.0.0.1:8000 \
            --table-name PickupRequests \
            --attribute-definitions AttributeName=id,AttributeType=S \
            --key-schema AttributeName=id,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --no-cli-pager

          aws dynamodb create-table \
            --endpoint-url http://127.0.0.1:8000 \
            --table-name DriverOffers \
            --attribute-definitions AttributeName=driverId,AttributeType=S AttributeName=pickupId,AttributeType=S \
            --key-schema AttributeName=driverId,KeyType=HASH AttributeName=pickupId,KeyType=RANGE \
            --billing-mode PAY_PER_REQUEST \
            --no-cli-pager

      - name: Run integration tests
        run: npm run test:integration
